name: Release

# 推一个 v* 的 tag（比如 v0.9.2）就在 GitHub 的机器上打 Windows 的 MSI 和 macOS 的 dmg，
# 挂到同名的草稿 Release 上。草稿要你自己点"发布"才对外可见。
# 也可以在 Actions 页面手动运行：只打包、把安装包当作构建产物留下，不建 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 服务器地址可选：仓库变量 ENCLAVE_CLOUD_URL = https://域名。
# 不设也能出包，只是包里不能登录。自测可以写 http://127.0.0.1:端口，装在跑服务器的那台机器上。
# 冒烟测试自己用本机替身服务器，不走这个变量。

jobs:
  windows-msi:
    runs-on: windows-latest
    env:
      ENCLAVE_CLOUD_URL: ${{ vars.ENCLAVE_CLOUD_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: tag 必须和 tauri.conf.json 的版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag 是 ${{ github.ref_name }}，tauri.conf.json 里是 $version。先改版本号再打 tag。"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      # 和本地打包走同一个脚本：host → sidecar → 前端 → MSI。
      - name: 打 MSI
        shell: pwsh
        run: ./scripts/windows-msi.ps1

      - name: 算哈希
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $sha = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msi.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "bytes=$($msi.Length)" >> $env:GITHUB_OUTPUT
          "### $($msi.Name)`n`n- SHA256 ``$sha```n- 字节 ``$($msi.Length)```n`n把这两个值更新到官网下载页和 docs/hashes.md。" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.msi.outputs.name }}
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error

      - name: 建草稿 Release 并挂上 MSI
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $line = "- ``${{ steps.msi.outputs.name }}`` · SHA256 ``${{ steps.msi.outputs.sha256 }}`` · ${{ steps.msi.outputs.bytes }} 字节"
          ./scripts/release-attach.ps1 -Tag "${{ github.ref_name }}" -File "${{ steps.msi.outputs.path }}" -Line $line

  macos-dmg:
    # macos-latest 是 Apple Silicon。只出 arm64 的包。
    runs-on: macos-latest
    env:
      ENCLAVE_CLOUD_URL: ${{ vars.ENCLAVE_CLOUD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      # 没人有 Mac，这台 runner 就是那台 Mac：用真实的内核走一遍准入、启动、握手、停止。
      # 这一步不过就不出包。
      # 冒烟用的这一份指向替身服务器（scripts/smoke-cloud.py），只在这一步用。
      # 后面打包时会用正式地址重新编译，并核对安装包里的那一份指向的是正式地址。
      - name: 真机冒烟
        env:
          ENCLAVE_CLOUD_URL: http://127.0.0.1:17956
        run: |
          cargo build --release -p enclave-host
          ./scripts/smoke-host.sh target/release/enclave-host

      - name: 打 dmg
        run: ./scripts/macos-dmg.sh

      - name: 算哈希
        id: dmg
        run: |
          dmg="$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          sha="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          bytes="$(stat -f%z "$dmg")"
          {
            echo "path=$dmg"
            echo "name=$(basename "$dmg")"
            echo "sha256=$sha"
            echo "bytes=$bytes"
          } >> "$GITHUB_OUTPUT"
          printf '### %s\n\n- SHA256 `%s`\n- 字节 `%s`\n' "$(basename "$dmg")" "$sha" "$bytes" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: 挂到草稿 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $line = "- ``${{ steps.dmg.outputs.name }}`` · SHA256 ``${{ steps.dmg.outputs.sha256 }}`` · ${{ steps.dmg.outputs.bytes }} 字节（未公证：装好后先执行 ``xattr -cr /Applications/Enclave.app``）"
          ./scripts/release-attach.ps1 -Tag "${{ github.ref_name }}" -File "${{ steps.dmg.outputs.path }}" -Line $line
