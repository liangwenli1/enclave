<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>账号 — Enclave</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="www-main">
    <p class="www-kicker">Account</p>
    <h1>账号在本机演示。</h1>
    <p class="www-lead">厂商许可证 API 还没接。这里只保存邮箱和档位到浏览器。不是付费通道。</p>
    <div id="panel" class="www-card www-card-narrow"></div>
  </main>
  <script src="js/site.js"></script>
  <script>
    const PLANS = { free: "Solo Free", solo: "Solo", pro: "Pro" };
    function render() {
      const el = document.getElementById("panel");
      const a = account.read();
      if (a) {
        el.innerHTML = `<p class="www-kicker">已登录</p><h3>${a.email}</h3><p class="www-mono">${PLANS[a.plan] || a.plan}</p>
          <div class="www-actions"><button class="www-btn www-btn-ghost" type="button" id="out">退出</button></div>`;
        document.getElementById("out").onclick = () => { account.clear(); render(); };
        return;
      }
      el.innerHTML = `<form class="www-form" id="reg">
        <label>邮箱<input type="email" name="email" required placeholder="you@company.com" /></label>
        <label>档位<select name="plan"><option value="free">Solo Free</option><option value="solo">Solo</option><option value="pro">Pro</option></select></label>
        <button class="www-btn www-btn-primary" type="submit">注册</button>
      </form>`;
      document.getElementById("reg").onsubmit = (e) => {
        e.preventDefault();
        const f = e.target;
        account.write({ email: f.email.value.trim().toLowerCase(), plan: f.plan.value, createdAt: Date.now() });
        render();
      };
    }
    document.addEventListener("DOMContentLoaded", render);
  </script>
</body>
</html>
