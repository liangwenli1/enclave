<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>安全与法律 — Enclave</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="www-main">
    <p class="www-kicker">Legal</p>
    <h1>安全与法律。</h1>
    <div class="www-grid">
      <article class="www-card"><h3>内核许可</h3><p>fingerprint-chromium 基于 Ungoogled Chromium，BSD-3-Clause。不是 100% 自研内核。补丁源码若延迟，不得宣传已完整审计。</p></article>
      <article class="www-card"><h3>第一版必须防</h3><p>恶意内核镜像哈希不符则拒启。假安装包必须靠签名挡住（签名尚未交付）。CDP 与本机 API 只绑回环。环境数据互不串。代理密码只存引用。</p></article>
      <article class="www-card"><h3>不承诺</h3><p>不承诺过某站风控。不承诺国家级完整控机。用户主动关沙箱后的后果自行承担。</p></article>
      <article class="www-card"><h3>披露</h3><p>security@enclave.local。正式域名未上，此地址是渠道草稿。</p></article>
    </div>
  </main>
  <script src="js/site.js"></script>
</body>
</html>
