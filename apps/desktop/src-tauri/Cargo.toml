[package]
name = "enclave-desktop"
version = "0.9.1"
description = "Enclave workbench shell. Unsigned preview, not 1.0."
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
